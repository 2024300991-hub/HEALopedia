<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMEPAGE</title>
    <link rel="stylesheet" href="css/frontpage.css">
</head>
<body>
    <header class="banner">
        <div class="logo">
            <img src="assets/logo.png" id="logo" alt="HEALopedia Logo">
            <span>HEALopedia</span>
        </div>
        <a href="html/about.html"><button type="button" class="about-btn">About us</button></a>
    </header>

    <main>
        <div class="banner-content">
            <h1>Learn health. Find care. Live Better.</h1>
            <p class="sub-text">"A comprehensive platform providing health literacy and medicine information across Pampanga."</p>
            <a href="html/main.html"><button class="proceed-btn">PROCEED</button></a>
        </div>

        <div class="folder-stack">
            <div class="layer layer-4"></div>
            <div class="layer layer-3"></div>
            <div class="layer layer-2"></div>
            
            <div class="folder-main">
                <div class="tabs-row">
                    <div class="tab homepage-tab">
                        <img src="assets/logo.png" class="tab-icon">
                        Homepage
                    </div>
                    <div class="tab pages-tab">Pages</div>
                </div>
                <div class="folder-base"></div>
            </div>
        </div>
    </main>
</body>
</html>
